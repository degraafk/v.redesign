<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#13261E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500..900;1,500..900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Noticias · VOX</title></head><body>
<div id="hdr"></div>
<main><div class="wrap">
<div class="phead"><div class="crumb"><a href="index.html">Inicio</a> / Noticias</div><h1>Noticias</h1><p>Todo lo que pasa en la campaña y en las instituciones.</p></div>
<div class="page"><div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div><div class="ngrid" id="list"></div></div>
</div></main>
<div id="ftr"></div>
<script src="site.js"></script>
<script>
const cats=["Todas",...new Set(NEWS.map(n=>n.c))];let cur="Todas";
const chips=document.getElementById("chips"),list=document.getElementById("list");
chips.innerHTML=cats.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join("");
function draw(){chips.querySelectorAll(".chip").forEach(b=>{const on=b.dataset.c===cur;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
list.innerHTML=sorted().filter(n=>cur==="Todas"||n.c===cur).map(ncard).join("");flow([...list.children])}
chips.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.c!==cur){cur=b.dataset.c;draw()}});draw();
</script></body></html>

<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0B1D19">

<div id="hdr"></div>
<main><div class="wrap">
<div class="phead"><div class="crumb"><a href="index.html">Inicio</a> / Noticias</div><h1>Noticias</h1><p>Todo lo que pasa en la campaña y en las instituciones.</p></div>
<div class="page"><div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div><div class="ngrid" id="list"></div></div>
</div></main>
<div id="ftr"></div>
<script src="site.js"></script>
<script>
const cats=["Todas",...new Set(NEWS.map(n=>n.c))];let cur="Todas";
function draw(){document.getElementById("chips").innerHTML=cats.map(c=>`<button class="chip${c===cur?" on":""}" data-c="${c}" aria-pressed="${c===cur}">${c}</button>`).join("");
document.getElementById("list").innerHTML=sorted().filter(n=>cur==="Todas"||n.c===cur).map(ncard).join("")}
document.getElementById("chips").addEventListener("click",e=>{const b=e.target.closest("button");if(b){cur=b.dataset.c;draw()}});draw();
</script></body></html>

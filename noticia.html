<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0C201B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Noticia · VOX</title></head><body>
<div id="hdr"></div>
<main><div class="wrap"><div class="page" id="art"></div></div></main>
<div id="ftr"></div>
<script src="site.js"></script>
<script>
const slug=new URLSearchParams(location.search).get("n"),n=NEWS.find(x=>x.slug===slug),A=document.getElementById("art");
if(!n){document.title="Noticia no encontrada · VOX";A.innerHTML='<div class="art"><h1>No encontramos esa noticia</h1><p style="margin:1rem 0 1.5rem;color:var(--muted)">Puede que el enlace esté mal o que la hayamos retirado.</p><a class="btn" href="noticias.html">Ver todas las noticias</a></div>'}
else{document.title=n.t+" · VOX";
const rel=sorted().filter(x=>x.slug!==n.slug).slice(0,3);
A.innerHTML=`<article class="art"><div class="crumb"><a href="index.html">Inicio</a> / <a href="noticias.html">Noticias</a> / ${n.c}</div>
<h1>${n.t}</h1><div class="meta"><span class="t">${n.c}</span><time datetime="${n.d}">${fmt(n.d,1)}</time></div>
<div class="hero-img ${n.g}"${n.img?' style="--g:url('+n.img+') 60% 30%/cover"':''} role="img" aria-label="Imagen de ejemplo"></div>
<div class="body">${n.b.map(p=>"<p>"+p+"</p>").join("")}</div>
<div class="share"><button class="btn out" id="cp">Copiar enlace</button><a class="btn out" href="noticias.html">Volver a noticias</a></div></article>
<div class="related"><h2>Más noticias</h2><div class="ngrid">${rel.map(x=>ncard(x)).join("")}</div></div>`;
document.getElementById("cp").onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);e.target.textContent="Enlace copiado"}}
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="motion.js"></script>
</body></html>

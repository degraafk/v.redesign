<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#13261E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500..900;1,500..900&family=Source+Serif+4:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Propuestas · VOX</title></head><body>
<div id="hdr"></div>
<main><div class="wrap">
<div class="phead"><div class="crumb"><a href="index.html">Inicio</a> / Propuestas</div><h1>Propuestas</h1><p>Nueve áreas, explicadas en pocas líneas.</p></div>
<div class="page layout"><nav class="side" id="side" aria-label="Áreas"></nav><div id="secs"></div></div>
</div></main>
<div id="ftr"></div>
<script src="site.js"></script>
<script>
document.getElementById("side").innerHTML=PROPS.map(p=>`<a href="#${p.id}">${p.t}</a>`).join("");
document.getElementById("secs").innerHTML=PROPS.map(p=>`<section class="psec${p.i?" has-fig":""}" id="${p.id}"><div class="ptxt"><h2>${p.t}</h2><p>${p.s}</p><ul>${p.l.map(x=>"<li>"+x+"</li>").join("")}</ul></div>${p.i?`<div class="pfig" role="img" aria-label="${p.t}" style="--img:url(${p.i});--pos:${p.o}"></div>`:""}</section>`).join("");
</script></body></html>
